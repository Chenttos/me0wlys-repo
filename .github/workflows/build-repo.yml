name: Build Sileo Repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gzip

      - name: Build APT repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/debs debs
          shopt -s nullglob
          packages=(debs/*.deb)
          if [ ${#packages[@]} -gt 0 ]; then
            cp "${packages[@]}" public/debs/
          fi
          cd public
          dpkg-scanpackages --multiversion debs /dev/null > Packages
          gzip -9 -k -f Packages
          {
            echo "Origin: me0wlys"
            echo "Label: me0wlys Repo"
            echo "Suite: stable"
            echo "Codename: stable"
            echo "Architectures: iphoneos-arm iphoneos-arm64 iphoneos-arm64e"
            echo "Components: main"
            echo "Description: me0wlys Sileo Repository"
            echo "Date: $(date -Ru)"
            for algorithm in MD5Sum SHA1 SHA256 SHA512; do
              case "$algorithm" in
                MD5Sum) command=md5sum ;;
                SHA1) command=sha1sum ;;
                SHA256) command=sha256sum ;;
                SHA512) command=sha512sum ;;
              esac
              echo "$algorithm:"
              for f in Packages Packages.gz; do
                printf " %s %s %s\n" "$($command "$f" | cut -d' ' -f1)" "$(wc -c < "$f" | tr -d ' ')" "$f"
              done
            done
          } > Release
          cat > index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <link rel="icon" href="CydiaIcon.png">
            <title>me0wlys Repo</title>
          </head>
          <body>
            <h1>me0wlys Repo</h1>
            <p>Sileo APT repository.</p>
            <p><a href="Release">Release metadata</a></p>
            <p><a href="Packages.gz">Package index</a></p>
          </body>
          </html>
          EOF

      - name: Copy repository icon
        run: |
          if [ -f CydiaIcon.png ]; then
            cp CydiaIcon.png public/CydiaIcon.png
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
