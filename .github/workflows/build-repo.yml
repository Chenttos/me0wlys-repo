name: Build Sileo Repository

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [tweak-built]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # >>> CHANGE THIS to the repo where the tweak is built (the one with the "latest-build" Release) <<<
  TWEAK_REPO: Chenttos/R3v4mp
  TWEAK_RELEASE_TAG: latest-build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gzip

      - name: Debug release lookup
        env:
          GH_TOKEN: ${{ secrets.TWEAK_REPO_TOKEN }}
        run: |
          echo "Repo: $TWEAK_REPO"
          gh repo view "$TWEAK_REPO" --json name,visibility
          gh release list --repo "$TWEAK_REPO" --limit 10
          
      - name: Download verified debs from the tweak Release
        env:
          # The tweak repo is private, so the built-in token cannot read its Releases.
          # Add a fine-grained token as a secret named TWEAK_REPO_TOKEN in THIS repo (see the steps in chat).
          GH_TOKEN: ${{ secrets.TWEAK_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::Secret TWEAK_REPO_TOKEN is missing in this repo's Actions secrets"; exit 1; }
          # Start clean: any .deb committed to this repo (possibly truncated) is ignored on purpose.
          rm -rf fetched && mkdir -p fetched

          gh release download "$TWEAK_RELEASE_TAG" \
            --repo "$TWEAK_REPO" \
            --pattern '*.deb' --pattern 'SHA256SUMS.txt' \
            --dir fetched --clobber

          cd fetched
          ls -l
          # 1. checksums published by the tweak build must match what we downloaded
          if [ -f SHA256SUMS.txt ]; then sha256sum -c SHA256SUMS.txt; fi
          # 2. every deb must be a structurally valid archive
          for f in *.deb; do
            size=$(stat -c %s "$f")
            echo "== $f: $size bytes"
            [ $((size % 2)) -eq 0 ] || { echo "::error::$f has an odd size ($size), truncated"; exit 1; }
            [ "$(head -c 8 "$f")" = '!<arch>' ] || { echo "::error::$f is not an ar archive"; exit 1; }
            dpkg-deb --info "$f" >/dev/null
            dpkg-deb --contents "$f" >/dev/null
            echo "   $(dpkg-deb -f "$f" Package Version Architecture | tr '\n' ' ')"
          done

      - name: Build APT repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/debs
          cp fetched/*.deb public/debs/
          cd public
          dpkg-scanpackages --multiversion debs /dev/null > Packages
          test -s Packages
          gzip -9 -k -f Packages
          {
            echo "Origin: me0wlys"
            echo "Label: me0wlys Repo"
            echo "Suite: stable"
            echo "Codename: stable"
            echo "Architectures: iphoneos-arm iphoneos-arm64 iphoneos-arm64e"
            echo "Components: main"
            echo "Description: me0wlys Sileo Repository"
            echo "Date: $(date -Ru)"
            for algorithm in MD5Sum SHA1 SHA256 SHA512; do
              case "$algorithm" in
                MD5Sum) command=md5sum ;;
                SHA1) command=sha1sum ;;
                SHA256) command=sha256sum ;;
                SHA512) command=sha512sum ;;
              esac
              echo "$algorithm:"
              for f in Packages Packages.gz; do
                printf " %s %s %s\n" "$($command "$f" | cut -d' ' -f1)" "$(wc -c < "$f" | tr -d ' ')" "$f"
              done
            done
          } > Release
          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <link rel="icon" href="CydiaIcon.png">
            <title>me0wlys Repo</title>
          </head>
          <body>
            <h1>me0wlys Repo</h1>
            <p>Sileo APT repository.</p>
            <p><a href="Release">Release metadata</a></p>
            <p><a href="Packages.gz">Package index</a></p>
          </body>
          </html>
          HTML

      - name: Copy repository icon
        run: |
          if [ -f CydiaIcon.png ]; then
            cp CydiaIcon.png public/CydiaIcon.png
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
