
name: Build Sileo Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate APT index
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gzip
          mkdir -p public/debs
          cp debs/*.deb public/debs/
          dpkg-scanpackages --multiversion debs /dev/null > public/Packages
          gzip -9 -k public/Packages
          cp -r debs/. public/debs/

      - name: Add repository page
        run: |
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html>
          <head><meta name="viewport" content="width=device-width">
          <title>My Sileo Repo</title></head>
          <body>
          <h1>My Sileo Repository</h1>
          <p>Add this source to Sileo:</p>
          <code id="source"></code>
          <script>
          document.getElementById('source').textContent =
            location.href.replace(/\/?$/, '/');
          </script>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
